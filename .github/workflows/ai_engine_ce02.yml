name: AI ENGINE CE-02 — Nat20-Rust qualification

on:
  push:
    branches:
      - 'ai-engine/ce02-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: Pinned baseline + source audit + independent knockout probes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check candidate provenance and isolation
        shell: bash
        run: |
          set -euo pipefail
          PIN=9aaca2fdb061cbd00e4772472cd0937bbe8e1b44
          git cat-file -e "$PIN^{commit}"
          git merge-base --is-ancestor "$PIN" HEAD
          git diff --name-only "$PIN" HEAD > ce02-changed-files.txt
          echo 'Files changed since pinned upstream commit:'
          cat ce02-changed-files.txt
          if grep -Ev '^($|\.github/workflows/ai_engine_ce02\.yml$|ai_engine_ce02/)' ce02-changed-files.txt; then
            echo 'FAIL: Candidate engine code changed; this is not a clean comparison.' >&2
            exit 2
          fi
          git rev-parse HEAD > ce02-evaluation-head.txt

      - name: Inspect source-level blockers (not runtime validation)
        shell: bash
        run: |
          python3 ai_engine_ce02/source_audit.py --repo-root . --output ce02-source-evidence.json

      - name: Run upstream native tests (supporting evidence only)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace 2>&1 | tee ce02-native-tests.log

      - name: Run CE-02 independent knockout probes (negative controls may fail)
        shell: bash
        run: |
          set -euo pipefail
          python3 ai_engine_ce02/run_acceptance.py --repo-root . --output ce02-independent-gates.json --log-dir ce02-probe-logs 2>&1 | tee ce02-independent-runner.log

      - name: Display independent gate classifications
        if: always()
        shell: bash
        run: |
          if test -f ce02-independent-gates.json; then
            python3 - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open('ce02-independent-gates.json', encoding='utf8'))
          print('## CE-02 independent gate evidence')
          print('**Native 338/338 is not independent acceptance.**')
          print('| Gate | Classification |')
          print('|---|---|')
          for gate in ('G07', 'G08', 'G09'):
              print(f"| {gate} | {report['gates'].get(gate, {}).get('status', 'NOT_EXECUTED')} |")
          print('G08 is a serializer capability check, not a crash-restart test.')
          PYCODE
          fi

      - name: Preserve source and native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nat20-rust-ce02-evidence
          path: |
            ce02-source-evidence.json
            ce02-native-tests.log
            ce02-changed-files.txt
            ce02-evaluation-head.txt
            ce02-independent-gates.json
            ce02-independent-runner.log
            ce02-probe-logs/*.log
          if-no-files-found: warn
          retention-days: 30
